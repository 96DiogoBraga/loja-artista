<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato | Cor &amp; Barro</title>
<meta name="description" content="Tire dúvidas sobre uma obra, peça uma encomenda ou fale com a artista.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="contato">

<main id="conteudo">
  <div class="container cabeca-pagina">
    <nav class="migalhas" aria-label="Você está em"><ol><li><a href="index.html">Início</a></li><li aria-current="page">Contato</li></ol></nav>
    <h1>Contato</h1>
    <p>Dúvidas sobre uma obra, encomendas ou convites para exposição: a resposta vem pelo WhatsApp ou por e-mail.</p>
  </div>
  <noscript><p style="padding:32px;text-align:center">Para ver as obras e usar o carrinho, ative o JavaScript do seu navegador.</p></noscript>
  <div class="container contato">
    <form id="contato-form" class="form" novalidate>
      <div class="campo">
        <label for="c-nome">Seu nome</label>
        <input id="c-nome" name="nome" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="c-assunto">Assunto</label>
        <select id="c-assunto" name="assunto">
          <option>Dúvida sobre uma obra</option>
          <option>Encomenda sob medida</option>
          <option>Exposições e parcerias</option>
          <option>Outro assunto</option>
        </select>
      </div>
      <div class="campo">
        <label for="c-mensagem">Mensagem</label>
        <textarea id="c-mensagem" name="mensagem" rows="6" required></textarea>
      </div>
      <p class="erro" id="erro-contato" role="alert"></p>
      <div class="acoes-form">
        <button class="btn" type="submit">Enviar pelo WhatsApp</button>
        <button class="btn btn--vazado" type="button" id="enviar-email">Enviar por e-mail</button>
      </div>
    </form>

    <aside class="contato__canais" aria-label="Outros canais">
      <div class="canal"><h3>WhatsApp</h3><p><a id="canal-zap" href="#" target="_blank" rel="noopener"></a></p></div>
      <div class="canal"><h3>E-mail</h3><p><a id="canal-email" href="#"></a></p></div>
      <div class="canal"><h3>Instagram</h3><p><a id="canal-insta" href="#" target="_blank" rel="noopener"></a></p></div>
      <div class="canal"><h3>Ateliê</h3><p id="canal-local"></p><p>Visitas com hora marcada.</p></div>
    </aside>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/produtos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
